name: New skill proposal
description: Propose a new skill (or offer to write one)
labels: ["new skill"]
body:
  - type: markdown
    attributes:
      value: |
        Good skills solve one recurring agent-building task end to end, stay vendor-neutral
        (no LLM provider or framework required), are safe by default (read-only, no network,
        no secrets), and include a tested helper script when that adds reliability.
        See CONTRIBUTING.md and templates/skill/SKILL.md.
  - type: input
    id: name
    attributes:
      label: Skill name
      description: lowercase-with-hyphens, max 64 characters
      placeholder: "intent-taxonomy-builder"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What task does it handle, and when should the agent use it?
      description: Example user requests that should trigger it.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow
      description: Steps, exact read-only commands, decision points, what the output looks like.
  - type: textarea
    id: script
    attributes:
      label: Helper script (optional)
      description: What would a deterministic script check or generate? Inputs, outputs, exit codes.
  - type: textarea
    id: safety
    attributes:
      label: Safety
      description: What could go wrong for the business or its users (data leaks, wrong actions, cost), and how the skill prevents it.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to write this skill
